version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Ignore minor and patch updates
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      # Group all updates together
      github-actions:
        patterns:
          - "*"
  # Bumps the _external/dcat-us gitlink (the DCAT-US 3.0 JSON Schemas) to the
  # branch in .gitmodules. A bump failing CI is expected -- see README.md.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "monthly"
