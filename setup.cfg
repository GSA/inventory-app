[extract_messages]
keywords = translate isPlural
add_comments = TRANSLATORS:
output_file = ckanext/datagov_inventory/i18n/ckanext-datagov_inventory.pot
width = 80

[init_catalog]
domain = ckanext-datagov_inventory
input_file = ckanext/datagov_inventory/i18n/ckanext-datagov_inventory.pot
output_dir = ckanext/datagov_inventory/i18n

[update_catalog]
domain = ckanext-datagov_inventory
input_file = ckanext/datagov_inventory/i18n/ckanext-datagov_inventory.pot
output_dir = ckanext/datagov_inventory/i18n
previous = true

[compile_catalog]
domain = ckanext-datagov_inventory
directory = ckanext/datagov_inventory/i18n
statistics = true

[flake8]
# _external holds third-party git submodules whose code we neither own nor
# style. Without this, `flake8 .` (make lint, and the lint job in
# .github/workflows/commit.yml) fails on their line lengths.
# extend-exclude rather than exclude, so flake8's own defaults survive.
extend-exclude = _external